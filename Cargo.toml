[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
filecleaner-core = { path = "crates/core" }
anyhow = "1"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# Les decodeurs d'images et le hachage restent rapides meme en debug.
[profile.dev.package."*"]
opt-level = 2
